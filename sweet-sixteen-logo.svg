<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#0167A4" stroke="#33B2FF" stroke-width="4"/>
  
  <!-- Basketball Lines -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#FF6B35" stroke-width="3"/>
  <path d="M 100 30 Q 120 100 100 170" fill="none" stroke="#FF6B35" stroke-width="2"/>
  <path d="M 100 30 Q 80 100 100 170" fill="none" stroke="#FF6B35" stroke-width="2"/>
  <path d="M 30 100 Q 100 120 170 100" fill="none" stroke="#FF6B35" stroke-width="2"/>
  <path d="M 30 100 Q 100 80 170 100" fill="none" stroke="#FF6B35" stroke-width="2"/>
  
  <!-- Sweet 16 Text -->
  <text x="100" y="90" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SWEET</text>
  <text x="100" y="125" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#FF6B35" text-anchor="middle">16</text>
  
  <!-- Houston Text -->
  <text x="100" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#FFFFFF" text-anchor="middle">HOUSTON</text>
</svg>
