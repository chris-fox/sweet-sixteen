<!DOCTYPE html>
<html>
<head>
	<meta name="viewport" content="width=device-width">
	<link rel="icon" type="image/svg+xml" href="sweet-sixteen-logo.svg">
	<title>Sweet Sixteen Houston - Countdown</title>
    <style type='text/css'>
body{
    text-align: center;
    background: #33B2FF;
	font-family: sans-serif;
	font-weight: 100;
	height: 100%;
	margin: 0px	
}

h1{
  color: #fff;
  font-weight: 100;
  font-size: 24px;
  margin: 10px 0px;
  /*margin: 10px 0px 0px;*/
}

#clockdiv{
    font-family: sans-serif;
    color: #fff;
    display: inline-block;
    font-weight: 100;
    text-align: center;
    font-size: 30px;
	margin: 10px 0px 10px;
}

#clockdiv > div{
    padding: 6px;
    border-radius: 3px;
    background: #5FBFF9;
    display: inline-block;
}

#clockdiv div > span{
    padding: 15px;
    border-radius: 3px;
    background: #0167A4;
    display: inline-block;
}

.smalltext{
    padding-top: 5px;
    font-size: 16px;
}
iframe{      
	display: block;  /* iframes are inline by default */   
	width: 100vw;  /* Set width to 100% of the viewport width */     
	border: none; /* Remove default border */
}

#title img{
    width: 150px;
    height: 150px;
    margin: 20px auto 10px;
}

    </style>
</head>	
<body>

<div id="title">
<img src="sweet-sixteen-logo.svg" alt="" role="presentation">
<h1>Countdown to Sweet Sixteen!!!</h1>
<div id="clockdiv">
  <div>
    <span class="days"></span>
    <div class="smalltext">Days</div>
  </div>
  <div>
    <span class="hours"></span>
    <div class="smalltext">Hours</div>
  </div>
  <div>
    <span class="minutes"></span>
    <div class="smalltext">Minutes</div>
  </div>
  <div>
    <span class="seconds"></span>
    <div class="smalltext">Seconds</div>
  </div>
</div>
</div>

<iframe id="frame" scrolling="auto" frameborder="0" title="Houston Sweet 16" allow="geolocation https://experience.arcgis.com" class="" src="https://experience.arcgis.com/experience/cb3cdbbbdcf845efb38efdd7a57ed2a6/"></iframe>

<script>
function getTimeRemaining(deadlineMs) {
  const t = deadlineMs - Date.now(); // Date.now() is an absolute instant
  const seconds = Math.floor((t / 1000) % 60);
  const minutes = Math.floor((t / 1000 / 60) % 60);
  const hours = Math.floor((t / (1000 * 60 * 60)) % 24);
  const days = Math.floor(t / (1000 * 60 * 60 * 24));
  return { total: t, days, hours, minutes, seconds };
}

function initializeClock(id, deadlineMs) {
  const clock = document.getElementById(id);
  const daysSpan = clock.querySelector('.days');
  const hoursSpan = clock.querySelector('.hours');
  const minutesSpan = clock.querySelector('.minutes');
  const secondsSpan = clock.querySelector('.seconds');

  function updateClock() {
    const t = getTimeRemaining(deadlineMs);
    daysSpan.textContent = t.days;
    hoursSpan.textContent = ('0' + t.hours).slice(-2);
    minutesSpan.textContent = ('0' + t.minutes).slice(-2);
    secondsSpan.textContent = ('0' + t.seconds).slice(-2);
    if (t.total <= 0) clearInterval(timeinterval);
  }

  updateClock();
  const timeinterval = setInterval(updateClock, 1000);
}

// Set the specific timezone for the event:
const deadline = new Date('2026-03-25T15:00:00-05:00');
// Or equivalently, in UTC:
//const deadline = new Date('2026-03-25T05:00:00Z');

initializeClock('clockdiv', deadline.getTime());

// keep your iframe sizing code
const title = document.getElementById('title');
const frame = document.getElementById('frame');
const height = title.offsetHeight + 10;
frame.style.height = `calc(100dvh - ${height}px)`;

</script>

</body>
</html>
